spring.application.name=NutriCheckAI

# Server port — Render injects PORT env var automatically
server.port=${PORT:8080}

# ── Database ─────────────────────────────────────────────────
# Set SPRING_DATASOURCE_URL / USERNAME / PASSWORD as env vars on Render or in local .env
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutricheckai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Groq AI (ingredient analysis) ──────────────────────────
# Get free key at https://console.groq.com — no credit card needed
# Set GROQ_API_KEY as env var on Render
groq.api.key=${GROQ_API_KEY:}
# Model for analysis — qwen/qwen3.8-27b provides excellent structured JSON on free tier
groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}
# Retry settings for transient errors (429 rate limit / 503 overload)
gemini.retry.max-attempts=${GROQ_RETRY_MAX_ATTEMPTS:3}
gemini.retry.backoff-ms=${GROQ_RETRY_BACKOFF_MS:2000}

# ── OCR.space (image text extraction) ──────────────────────
# Get free key at https://ocr.space/ocrapi — just enter your email
# Falls back to public demo key K88888888 if not set (lower rate limits)
ocr.api.key=${OCR_API_KEY:K88888888}

# ── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB



# ── CORS ─────────────────────────────────────────────────────
# Set ALLOWED_ORIGINS as env var on Render (comma-separated Vercel URLs)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}