spring.application.name=NutriCheckAI

# Server port — Render injects PORT env var automatically
server.port=${PORT:8080}

# ── Database ─────────────────────────────────────────────────
# Set SPRING_DATASOURCE_URL / USERNAME / PASSWORD as env vars on Render or in local .env
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutricheckai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Gemini AI ────────────────────────────────────────────────
# Set GEMINI_API_KEY as an env var (never commit the real key)
gemini.api.key=${GEMINI_API_KEY:}
# Model to use — change here without touching Java code
# Options: gemini-2.0-flash, gemini-1.5-flash, gemini-2.5-flash
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
# Retry settings for transient 503 / overload errors
gemini.retry.max-attempts=${GEMINI_RETRY_MAX_ATTEMPTS:3}
gemini.retry.backoff-ms=${GEMINI_RETRY_BACKOFF_MS:2000}

# ── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── OCR (now using Gemini Vision — tesseract path kept for reference only) ──
tesseract.datapath=C:/Program Files/Tesseract-OCR/tessdata
tesseract.language=eng

# ── CORS ─────────────────────────────────────────────────────
# Set ALLOWED_ORIGINS as env var on Render (comma-separated Vercel URLs)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}