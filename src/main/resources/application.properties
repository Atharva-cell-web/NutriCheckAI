spring.application.name=NutriCheckAI

# Server port — Render injects PORT env var automatically
server.port=${PORT:8080}

# ── Database ─────────────────────────────────────────────────
# Set SPRING_DATASOURCE_URL / USERNAME / PASSWORD as env vars on Render
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-frosty-king-aotmxumd.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_OHpFsMr3VXJ7}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Gemini AI ────────────────────────────────────────────────
# Set GEMINI_API_KEY as an env var on Render
gemini.api.key=${GEMINI_API_KEY:AQ.Ab8RN6IGIYsRFGR9jCi07xbTLUDnbzeHqjW8QiTCPuOGBwY12Q}

# ── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── OCR (now using Gemini Vision — tesseract path kept for reference only) ──
tesseract.datapath=C:/Program Files/Tesseract-OCR/tessdata
tesseract.language=eng

# ── CORS ─────────────────────────────────────────────────────
# Set ALLOWED_ORIGINS as env var on Render (comma-separated Vercel URLs)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}